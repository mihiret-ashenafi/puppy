<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puppy Lovers</title>
    <link rel="stylesheet" href="css/puppy.css" />
  </head>
  <body>
    <header class="header">
      <p>Puppy lovers page</p>
    </header>
    <section id="banner">
      <div><img src="../images/banner-puppies.jpg" alt="Puppy Banner" /></div>
    </section>

    <section class="puppies-section">
      <div class="puppiess-section">
        <div class="puppy1">
          <img src="../images/puppy-1.jpg" alt="Puppy 1" />
        </div>
        <div class="missing-puppy">
          <div class="missing-wrapper">Puppy missing here!!</div>
        </div>
        <div class="puppy2">
          <img src="../images/puppy-2.jpg" alt="Puppy 2" />
        </div>
      </div>
    </section>

    <section class="additional-puppies">
      <div class="fixed-container">
        <h2>More Puppies</h2>

        <div class="more-puppies-wrapper">
          <div class="puppy3">
            <img src="../images/puppy-3.jpg" alt="Puppy 3" />
          </div>
          <div class="puppy4">
            <img src="../images/puppy-4.jpg" alt="Puppy 4" />
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>Developed by: Mihiret.A</p>
    </footer>
  </body>
</html>
